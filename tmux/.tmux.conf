# Otions to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh

# Change prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Sesh recommended settings
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"

# Automatic window renaming - but preserve manual names
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
set -g allow-rename off

# When you manually rename a window, disable automatic renaming for that window
bind , command-prompt -p "rename window to:" "rename-window '%%'; set-window-option automatic-rename off"

# Sesh
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Sesh window switcher
bind-key "W" run-shell "selected=\"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\" && [ -n \"$selected\" ] && sesh window \"$selected\" || true"

# Sesh picker
bind-key "K" display-popup -h 90% -w 50% -E "sesh picker -i"

# Configure the catppuccin plugin
# Flavor is sourced from a state file so prefix+B can toggle dark/light at runtime.
source ~/.config/tmux/flavor.conf # sets @catppuccin_flavor (mocha=dark, latte=light)
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Toggle catppuccin dark (mocha) <-> light (latte)
bind B run-shell "~/.config/tmux/scripts/toggle-theme.sh"

# Override catppuccin window text to show window name instead of title
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`

# Load custom catppuccin status modules
source ~/.config/tmux/plugins/catppuccin/tmux/status/disk.conf

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-interval 2  # Refresh status every 2 seconds for Claude status updates

# Claude status will be handled by tmux-claude-status plugin
set -g status-left ""

# Right status: Show directory instead of application + Claude status
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_gitmux}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_memory}"
set -agF status-right "#{E:@catppuccin_status_disk}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Claude status plugin configuration
set -g @claude-notification-sound "chime"
set -g @claude-wait-key "Z"

set -g @plugin 'samleeney/tmux-claude-status'

# Spotify controls (requires spotify_player daemon: `spotify_player -d`)
bind > run-shell "spotify_player playback next"
bind < run-shell "spotify_player playback previous"
bind p run-shell "spotify_player playback play-pause"
bind M display-popup -E -w 80% -h 80% "spotify_player"

# gh dash popup
bind g display-popup -E -w 90% -h 90% "gh dash"

# Howard the Duck - rubber duck thinking partner
bind h display-popup -E -w 80% -h 80% "tmux has-session -t howard 2>/dev/null && tmux attach -t howard || tmux new-session -s howard -c /Users/dev/_duckie 'howard'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
